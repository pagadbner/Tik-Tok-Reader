name: Android APK

on:
  push:
    branches: [ main, master, feature/in-app-updater-signing-release ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout Piper Kotlin engine and native submodules
        uses: actions/checkout@v4
        with:
          repository: piper-tts-apps/piper-kotlin
          path: piper-kotlin
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 requested the removed SDK package "tools" on some runners.
      # v4 uses current command-line tools and handles SDK license acceptance.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Prepare Piper native dependencies and Spanish runtime assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-piper-assets.sh
          ./scripts/prepare-piper-assets.sh

      - name: Configure persistent Android release signing
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release')) || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tiklbot-release.jks"
          test -s "$RUNNER_TEMP/tiklbot-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tiklbot-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests and build debug APK (pull requests)
        if: ${{ !(github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release'))) }}
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        if: ${{ !(github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release'))) }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload debug APK artifact
        if: ${{ !(github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: TikLBot-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests and build signed release APK (main)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release')) || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature matches the permanent keystore
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release')) || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          KEY_CERT="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$KEY_CERT" && test -n "$APK_CERT"
          test "$KEY_CERT" = "$APK_CERT" || { echo "::error::APK certificate does not match the permanent signing key"; exit 1; }
          echo "APK signature matches the permanent TikLBot signing certificate."

      - name: Prepare verified release assets
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release')) || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/TikLBot-latest.apk
          (cd release-assets && sha256sum TikLBot-latest.apk > TikLBot-latest.apk.sha256)
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          printf 'VersionName: %s\nVersionCode: %s\n\nActualización oficial de TikLBot.\n' "$VERSION_NAME" "$VERSION_CODE" > release-assets/release-info.txt
          ls -lh release-assets
          sha256sum release-assets/TikLBot-latest.apk

      - name: Upload signed release APK artifact
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/in-app-updater-signing-release')) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TikLBot-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
