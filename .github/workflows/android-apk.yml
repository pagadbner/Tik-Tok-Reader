name: Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout Piper Kotlin engine and native submodules
        uses: actions/checkout@v4
        with:
          repository: piper-tts-apps/piper-kotlin
          path: piper-kotlin
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # sdkmanager is interactive when one or more Android SDK licenses
      # have not yet been accepted on the runner. Feed affirmative answers
      # before installing any SDK/NDK/CMake packages.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses <<'LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          LICENSES

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Prepare Piper native dependencies and Spanish runtime assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-piper-assets.sh
          ./scripts/prepare-piper-assets.sh

      - name: Run unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK and show size
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Live-Reader-Android-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          generate_release_notes: true
